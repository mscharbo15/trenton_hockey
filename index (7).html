:root{--bg:#f4f6f9;--card:rgba(255,255,255,.92);--txt:#0f1e36;--mut:#6b7a90;--t:#14284b;--o:#d64545;--dump:#e0b300;--dumpT:#b38f00;--ice:#d9c27a;--iceT:#a8914a;--fail:#9aa6b6;--tile:#f4f6f9}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:'Barlow',sans-serif;color:var(--txt);background:var(--bg);background-image:linear-gradient(#e9edf2 1px,transparent 1px),linear-gradient(90deg,#e9edf2 1px,transparent 1px);background-size:30px 30px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:22px 14px 40px}
.bc{font-family:'Barlow Condensed'}
/* header */
.top{display:flex;align-items:center;gap:14px;padding:4px 4px 0}
.top img{width:84px;height:84px;object-fit:contain}
.ttl{flex:1;min-width:0} .ttl b{display:block;font-family:'Barlow Condensed';font-weight:900;font-size:40px;line-height:.95;letter-spacing:.5px}
.ttl span{font-family:'Barlow Condensed';font-weight:800;font-size:19px;color:var(--mut);letter-spacing:1.5px}
.ttl b{font-size:38px!important;white-space:nowrap}
/* filter dropdown */
.dd{position:relative;margin-top:16px;z-index:5}
.ddb{width:100%;display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:14px;padding:14px 18px;box-shadow:0 2px 0 #e1e6ed;cursor:pointer;text-align:left}
.ddb em{font-style:normal;font-family:'Barlow Condensed';font-weight:800;font-size:16px;letter-spacing:3px;color:#9aa6b6}
.ddb b{flex:1;font-family:'Barlow Condensed';font-weight:800;font-size:26px;color:var(--txt)}
.ddb i{width:12px;height:12px;border-right:3px solid #e0b300;border-bottom:3px solid #e0b300;transform:rotate(45deg) translate(-3px,-3px);transition:transform .15s}
.dd.open .ddb i{transform:rotate(-135deg) translate(-3px,-3px)}
.ddl{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(15,30,54,.16);overflow:hidden}
.dd.open .ddl{display:block}
.ddl button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:#fff;border-top:1px solid #eef1f5;padding:13px 18px;font-family:'Barlow Condensed';font-weight:700;font-size:21px;color:var(--mut);cursor:pointer;text-align:left}
.ddl button:first-child{border-top:0} .ddl{max-height:70vh;overflow-y:auto} .ddg{font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:2px;color:#9aa6b6;padding:12px 18px 6px;border-top:2px solid #eef1f5;background:#fafbfc} .ddl button.on{color:var(--txt);font-weight:800} .ddl button.on:after{content:"";width:9px;height:9px;border-radius:50%;background:#e0b300}
/* stat row */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:16px;box-shadow:0 2px 0 #e1e6ed;margin-top:14px;padding:16px 4px}
.kpi div{text-align:center;border-left:2px solid #eef1f5} .kpi div:first-child{border-left:0}
.kpi b{display:block;font-family:'Barlow Condensed';font-weight:900;font-size:50px;line-height:1;color:var(--t)}
.kpi span{display:block;margin-top:6px;font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:.6px;color:var(--mut);white-space:nowrap}
/* segmented */
.seg{display:flex;background:#e6ebf1;border-radius:12px;padding:4px;gap:4px;margin-top:16px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;font-family:'Barlow Condensed';font-weight:800;font-size:17px;letter-spacing:1px;color:var(--mut);padding:9px 4px;border-radius:9px;cursor:pointer}
.seg button.on{background:#fff;color:var(--txt);box-shadow:0 1px 2px rgba(15,30,54,.12)}
.seg.sm{margin-top:0;padding:3px;border-radius:10px} .seg.sm button{font-size:14px;padding:6px 10px;border-radius:7px}
/* cards */
.card{background:var(--card);border-radius:16px;padding:16px 16px;box-shadow:0 2px 0 #e1e6ed;margin-top:14px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.h{font-family:'Barlow Condensed';font-weight:800;font-size:28px;letter-spacing:.5px;line-height:1}
/* big split bar */
.sb{display:flex;gap:3px;height:64px;border-radius:12px;overflow:hidden;margin-top:12px}
.sb div{display:flex;align-items:center;min-width:0;color:#fff;font-family:'Barlow Condensed';font-weight:900;font-size:40px;white-space:nowrap}
.sb .l{background:var(--t);padding-left:14px} .sb .r{background:var(--o);justify-content:flex-end;padding-right:14px}
.sb img{width:46px;height:46px;object-fit:contain}
.sbl{display:flex;justify-content:space-between;margin-top:6px;font-family:'Barlow Condensed';font-weight:800;font-size:14px;letter-spacing:1px;color:var(--mut)}
/* tiles */
.tiles{display:grid;gap:10px;margin-top:12px} .tiles.t3{gap:8px} .t3 .pt{padding:12px 8px 10px} .t3 .ptn{font-size:25px} .t3 .ptt{font-size:15px}
.pt{background:var(--tile);border-radius:12px;padding:13px 12px 11px}
.ptt{font-family:'Barlow Condensed';font-weight:900;font-size:17px;text-align:center;letter-spacing:.5px;line-height:1.1}
.ptn{display:flex;justify-content:space-between;font-family:'Barlow Condensed';font-weight:900;font-size:32px;line-height:1;margin:9px 0 8px}
.ptb{display:flex;gap:3px;height:9px;border-radius:5px;overflow:hidden} .ptb i{display:block;height:100%}
/* game rows */
.gl{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.g{background:var(--tile);border-radius:12px;padding:10px 12px;display:block;color:inherit;text-decoration:none}
.gh{display:flex;align-items:center;gap:8px}
.res{font-family:'Barlow Condensed';font-weight:900;font-size:15px;color:#fff;border-radius:6px;padding:2px 7px;letter-spacing:.5px;flex-shrink:0}
.res.W{background:var(--t)} .res.L{background:#9aa6b6} .res.T{background:#c3ccd7}
.gn{font-family:'Barlow Condensed';font-weight:800;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gd{font-family:'Barlow Condensed';font-weight:700;font-size:15px;color:var(--mut);letter-spacing:.5px;white-space:nowrap}
.gb{display:flex;gap:3px;height:30px;border-radius:8px;overflow:hidden;margin-top:8px}
.gb div{display:flex;align-items:center;font-family:'Barlow Condensed';font-weight:900;font-size:20px;color:#fff;white-space:nowrap;min-width:0}
.gb .l{background:var(--t);padding-left:9px} .gb .r{background:var(--o);justify-content:flex-end;padding-right:9px}
.ga{display:flex;justify-content:space-between;margin-top:5px;font-family:'Barlow Condensed';font-weight:800;font-size:15px;letter-spacing:.5px;color:#7d8aa0}
/* special teams */
.evst{display:flex;justify-content:space-between;margin-top:4px;font-family:'Barlow Condensed';font-weight:800;font-size:16px;letter-spacing:.5px;color:var(--mut)} .evst b{color:var(--txt);font-weight:900}
.stt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sti{background:var(--tile);border-radius:12px;padding:12px 12px 10px}
.sti h4{font-family:'Barlow Condensed';font-weight:900;font-size:17px;letter-spacing:.5px;text-align:center;margin-bottom:2px}
.sti .big{text-align:center;margin:4px 0 2px} .sti .big b{font-family:'Barlow Condensed';font-weight:900;font-size:40px;line-height:1;color:var(--t)} .sti .big span{font-family:'Barlow Condensed';font-weight:800;font-size:16px;color:var(--mut);margin-left:6px}
.sti .r2{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #e6ebf1;padding-top:7px;margin-top:7px;font-size:14px;color:var(--mut);font-weight:600} .sti .r2:first-of-type{border-top:0}
.sti .r2 b{font-family:'Barlow Condensed';font-weight:900;font-size:20px;color:var(--txt)}
.g .gs{display:flex;justify-content:space-between;margin-top:5px;font-family:'Barlow Condensed';font-weight:800;font-size:15px;color:#7d8aa0}
.xmrow{margin-top:10px} .xmrow .seg.sm{display:flex} .xmrow .seg.sm button{flex:1}
.zsum{display:flex;align-items:baseline;gap:10px;background:var(--tile);border-radius:12px;padding:10px 14px;margin-top:10px}
.zsum span{flex:1;font-family:'Barlow Condensed';font-weight:900;font-size:18px;letter-spacing:.5px} .zsum b{font-family:'Barlow Condensed';font-weight:900;font-size:32px;line-height:1;color:var(--t)} .zsum em{font-style:normal;font-family:'Barlow Condensed';font-weight:800;font-size:16px;color:var(--mut)}
#zsx button{font-size:12px;padding:6px 2px;letter-spacing:.5px}
/* players */
.pl{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.pr{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.pr .nm{font-family:'Barlow Condensed';font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pr .nm em{font-style:normal;color:var(--mut);font-weight:700;margin-right:6px}
.pr .vals{font-family:'Barlow Condensed';font-weight:800;font-size:15px;color:var(--mut);white-space:nowrap} .pr .vals b{font-weight:900;font-size:20px;color:var(--t)}
.pb{grid-column:1/3;height:8px;border-radius:4px;background:#e6ebf1;overflow:hidden} .pb i{display:block;height:100%;background:var(--t);border-radius:4px}
.ph{display:flex;justify-content:space-between;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:1px;color:var(--mut);margin-top:12px;border-bottom:2px solid #eef1f5;padding-bottom:6px}
.gt{width:100%;border-collapse:collapse;margin-top:12px;font-family:'Barlow Condensed'} .gt th{font-weight:800;font-size:13px;letter-spacing:1px;color:var(--mut);text-align:right;padding:4px 4px;border-bottom:2px solid #eef1f5} .gt th:first-child,.gt td:first-child{text-align:left}
.gt td{font-weight:900;font-size:19px;text-align:right;padding:8px 4px;border-bottom:1px solid #eef1f5} .gt td:first-child{font-weight:800}
.sbh{font-family:'Barlow Condensed';font-weight:900;font-size:17px;letter-spacing:.5px;text-align:center;margin-top:12px}
.sbh+.sb{margin-top:8px}
.stzv{font-family:'Barlow Condensed';font-weight:900;font-size:32px;line-height:1;text-align:center;color:var(--t);margin:9px 0 8px}
.stz .stzh{display:flex;justify-content:space-between;align-items:baseline;font-family:'Barlow Condensed';margin-bottom:8px} .stz .stzh span{font-weight:900;font-size:17px;letter-spacing:.5px}
.stz .stzh b{font-weight:900;font-size:28px;line-height:1;color:var(--t)} .stz .stzh em{font-style:normal;font-weight:800;font-size:12px;letter-spacing:1px;color:var(--mut);margin-right:5px}
.stz .stzn{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap} .stz .stzn b{font-family:'Barlow Condensed';font-weight:900;font-size:16px}
.g .arr{color:#9aa6b6;font-weight:900;font-family:'Barlow Condensed';font-size:18px}
/* zone */
.zwrap{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;margin-top:8px}
.rl{font-family:'Barlow Condensed';font-weight:800;font-size:14px} .dbig{font-family:'Barlow Condensed';font-weight:900;font-size:40px;fill:#0f1e36} .dsm{font-family:'Barlow Condensed';font-weight:800;font-size:15px;fill:var(--mut);letter-spacing:1px}
.zl{display:flex;flex-direction:column;gap:6px}
.zl div{display:flex;align-items:baseline;gap:10px} .zl b{font-family:'Barlow Condensed';font-weight:900;font-size:40px;line-height:1;min-width:58px;text-align:right} .zl span{font-size:16px;color:var(--mut);font-weight:600}
.zg{display:flex;flex-direction:column;gap:9px;margin-top:14px;border-top:2px solid #eef1f5;padding-top:12px}
.zgr{display:grid;grid-template-columns:1fr 52px;gap:4px 10px;align-items:center}
.zgr .gn{font-size:17px} .zgr .pc{font-family:'Barlow Condensed';font-weight:900;font-size:22px;text-align:right;color:var(--t)}
.zb{grid-column:1/3;display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden} .zb i{display:block;height:100%}
.pill{display:inline-block;vertical-align:middle;margin-left:8px;font-family:'Barlow Condensed';font-weight:800;font-size:13px;letter-spacing:1px;line-height:1;color:#fff;background:var(--t);border-radius:6px;padding:4px 7px 3px;position:relative;top:-3px} .pill.fg{background:#9aa6b6}
#per{margin-top:10px} #per button{font-size:16px}
.empty{text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:22px;color:var(--mut);padding:40px 0;letter-spacing:1px}
@media (max-width:380px){.zwrap{grid-template-columns:160px 1fr}.ttl b{font-size:34px}.rec b{font-size:48px}}

<script>
(function(){
const C={t:"#14284b",o:"#d64545",dump:"#e0b300",dumpT:"#b38f00",ice:"#d9c27a",iceT:"#a8914a",fail:"#9aa6b6"};
const sum=a=>a.reduce((x,y)=>x+(+y||0),0), f2=v=>(+v).toFixed(2), f1=v=>(+v).toFixed(1), pct=(a,b)=>Math.round(100*a/((a+b)||1));
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
const dfmt=s=>{const d=new Date(s+"T12:00:00");return `${MON[d.getMonth()]} ${d.getDate()}`;};
const games=GAMES.slice().sort((a,b)=>a.date<b.date?-1:1);
const hasHA=games.length&&games.every(g=>typeof g.home==="boolean");
const hasScore=games.length&&games.every(g=>Array.isArray(g.score));
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const monthOf=g=>+g.date.slice(5,7)-1;
const FILTERS=[["All Season","ALL",gs=>gs],["Last 5 Games","L5",gs=>gs.slice(-5)],
  ["Wins Only","W",gs=>gs.filter(g=>resOf(g)==="W")],["Losses Only","L",gs=>gs.filter(g=>resOf(g)==="L")]]
  .concat(hasHA?[["Home","H",gs=>gs.filter(g=>g.home)],["Away","A",gs=>gs.filter(g=>!g.home)]]:[])
  .concat([...new Set(games.map(g=>g.date.slice(0,7)))].map(ym=>[MONTHS[+ym.slice(5,7)-1],"M"+ym,gs=>gs.filter(g=>g.date.startsWith(ym))]))
  .concat(games.slice().reverse().map((g,i)=>[`${hasHA?(g.home?"vs ":"@ "):""}${g.opp} · ${dfmt(g.date)}`,"G"+g.date+"|"+g.opp,gs=>gs.filter(x=>x===g),"game"]));
let OPEN=false;
let F="ALL", GM="xg", ZM="entries", XM="all", ZS="all", PM="sk", PF="all", SM="cf", P="all";
const resOf=g=>g.result||(g.score?(g.score[0]>g.score[1]?"W":g.score[0]<g.score[1]?"L":"T"):"");
function pick(){return FILTERS.find(x=>x[1]===F)[2](games);}
function record(gs){const w=gs.filter(g=>resOf(g)==="W").length,l=gs.filter(g=>resOf(g)==="L"&&!g.ot).length,o=gs.filter(g=>resOf(g)==="L"&&g.ot).length,t=gs.filter(g=>resOf(g)==="T").length;
  return `${w}–${l}${o?`–${o}`:""}${t?`–${t}`:""}`;}
// ring with % labels (same as the postgame card)
function arcs(parts,r,sw,size,gap){const circ=2*Math.PI*r;let off=0,o="";parts.forEach(([v,col])=>{const L=circ*v/100;
  o+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${Math.max(L-gap,0)} ${circ-L+gap}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=L});return o;}
function ring(items,small){const tot=sum(items.map(i=>i[1]));let p=items.map(i=>Math.round(100*i[1]/(tot||1)));p[p.length-1]=100-sum(p.slice(0,-1));
  const r=60,c=85;let off=0,lab="";p.forEach((v,i)=>{if(v>=7){const a=(off+v/2)/100*2*Math.PI-Math.PI/2;lab+=`<text x="${(c+r*Math.cos(a)).toFixed(1)}" y="${(c+r*Math.sin(a)+5.5).toFixed(1)}" text-anchor="middle" class="rl" fill="${items[i][2]===C.t?"#fff":"#0f1e36"}">${v}%</text>`;}off+=v;});
  return `<svg viewBox="0 0 170 170" width="100%">${arcs(p.map((v,i)=>[v,items[i][2]]),r,32,170,1.5)}${lab}<text x="85" y="99" text-anchor="middle" class="dbig">${tot}</text></svg>`;}
const tile=(lab,a,b,fmt)=>{const p=100*a/((a+b)||1);return `<div class="pt"><div class="ptt">${lab}</div><div class="ptn"><b style="color:${C.t}">${fmt(a)}</b><b style="color:${C.o}">${fmt(b)}</b></div><div class="ptb"><i style="width:${p}%;background:${C.t}"></i><i style="flex:1;background:${C.o}"></i></div></div>`;};

function wire(){
  const d=document.getElementById("ddb"); if(d) d.onclick=e=>{e.stopPropagation();OPEN=!OPEN;render();};
  document.querySelectorAll(".ddl button").forEach(b=>b.onclick=e=>{e.stopPropagation();F=b.dataset.f;OPEN=false;render();});
  document.querySelectorAll("#gm button").forEach(b=>b.onclick=()=>{GM=b.dataset.m;render();});
  document.querySelectorAll("#zm button").forEach(b=>b.onclick=()=>{ZM=b.dataset.z;render();});
  document.querySelectorAll("#xm button").forEach(b=>b.onclick=()=>{XM=b.dataset.x;render();});
  document.querySelectorAll("#zsx button").forEach(b=>b.onclick=()=>{ZS=b.dataset.s;render();});
  document.querySelectorAll("#per button").forEach(b=>b.onclick=()=>{P=b.dataset.p2==="all"?"all":+b.dataset.p2;render();});
  document.querySelectorAll("#sm button").forEach(b=>b.onclick=()=>{SM=b.dataset.s2;render();});
  document.querySelectorAll("#pm button").forEach(b=>b.onclick=()=>{PM=b.dataset.p;render();});
  document.querySelectorAll("#pf button").forEach(b=>b.onclick=()=>{PF=b.dataset.pf;render();});}
document.addEventListener("click",()=>{if(OPEN){OPEN=false;render();}});
function render(){
  const G0=pick();
  // period view: swap each game for its period split (games without that period drop out)
  const PL=["1ST","2ND","3RD","OT"], pAvail=PL.map((_,i)=>G0.some(g=>g.per&&g.per[i])); if(P!=="all"&&!pAvail[P])P="all";
  const gs=P==="all"?G0:G0.filter(g=>g.per&&g.per[P]).map(g=>{const q=g.per[P];return {...g,xg:q.xg,att:q.att,ff:q.ff,entries:q.entries,exits:q.exits,st:undefined,pzs:q.zs};}), n=gs.length||1;
  const PB=P==="all"?"":`<span class="pill">${PL[P]} PERIOD</span>`, FG=P==="all"?"":`<span class="pill fg">FULL GAME</span>`;
  const xT=sum(gs.map(g=>g.xg[0]))/n, xO=sum(gs.map(g=>g.xg[1]))/n, aT=sum(gs.map(g=>g.att[0])), aO=sum(gs.map(g=>g.att[1]));
  const sv=pct(aT,aO);
  let h=`<div class="top"><img src="${TRE_LOGO}"><div class="ttl"><b>TRENTON HOCKEY</b><span>${SEASON} SEASON</span></div></div>`;
  const cur=FILTERS.find(f=>f[1]===F)[0];
  h+=`<div class="dd${OPEN?" open":""}" id="dd"><button class="ddb" id="ddb"><em>FILTER</em><b>${cur}</b><i></i></button><div class="ddl">${FILTERS.map((f,i)=>`${f[3]==="game"&&(!FILTERS[i-1]||FILTERS[i-1][3]!=="game")?`<div class="ddg">GAMES</div>`:""}<button data-f="${f[1]}" class="${F===f[1]?"on":""}">${f[0]}</button>`).join("")}</div></div>`;
  if(pAvail.some(Boolean))h+=`<div class="seg" id="per">${[["all","FULL GAME"]].concat(PL.map((l,i)=>[i,l]).filter(([i])=>pAvail[i])).map(([k,l])=>`<button data-p2="${k}" class="${String(P)===String(k)?"on":""}">${l}</button>`).join("")}</div>`;
  const eC=sum(gs.map(g=>g.entries.c+g.entries.d)), eT=sum(gs.map(g=>g.entries.c+g.entries.d+g.entries.f));
  h+=`<div class="kpi"><div><b>${record(G0)}</b><span>RECORD</span></div><div><b>${gs.length?pct(sum(gs.map(g=>g.att[0])),sum(gs.map(g=>g.att[1])))+"%":"–"}</b><span>SHOT VOL</span></div><div><b>${eT?Math.round(100*eC/eT)+"%":"–"}</b><span>SUCCESSFUL ENTRY</span></div></div>`;
  if(games.length&&!G0.length){document.getElementById("app").innerHTML=h+`<div class="card"><div class="empty">NO GAMES</div></div>`;wire();return;}
  if(!games.length){document.getElementById("app").innerHTML=h+`<div class="card"><div class="empty">FIRST GAME COMING SOON</div></div>`;wire();return;}
  // expected goals (per game average)
  // special teams (games that have st data)
  const sg=gs.filter(g=>g.st), sn=sg.length, sgF=G0.filter(g=>g.st), snF=sgF.length;
  if(!sn&&GM==="st")GM="xg";
  const stX=g=>[g.st.ppXg+(g.st.shXg||0),g.st.oppPpXg+(g.st.oppShXg||0)];
  const stA=g=>[(g.st.ppAtt||0)+(g.st.shAtt||0),(g.st.oppPpAtt||0)+(g.st.oppShAtt||0)];
  if(!sn&&XM!=="all")XM="all";
  const base=XM==="all"?gs:sg, bn=base.length||1;
  const vx=g=>XM==="all"?g.xg:XM==="st"?stX(g):[g.xg[0]-stX(g)[0],g.xg[1]-stX(g)[1]];
  const va=g=>XM==="all"?g.att:XM==="st"?stA(g):[g.att[0]-stA(g)[0],g.att[1]-stA(g)[1]];
  const mT=sum(base.map(g=>vx(g)[0]))/bn, mO=sum(base.map(g=>vx(g)[1]))/bn, nT=sum(base.map(g=>va(g)[0]))/bn, nO=sum(base.map(g=>va(g)[1]))/bn;
  const p=100*mT/((mT+mO)||1);
  const xseg=sn?`<div class="seg sm" id="xm">${[["all","ALL"],["ev","EVEN STRENGTH"],["st","SPECIAL TEAMS"]].map(([k,l])=>`<button data-x="${k}" class="${XM===k?"on":""}">${l}</button>`).join("")}</div>`:"";
  h+=`<div class="card"><div class="h">EXPECTED GOALS / GAME${PB}</div>${xseg?`<div class="xmrow">${xseg}</div>`:""}
    <div class="sb"><div class="l" style="width:${p}%">${f2(mT)}</div><div class="r" style="width:${100-p}%">${f2(mO)}</div></div>
    <div class="sbl"><span>TRENTON</span><span>OPPONENTS</span></div>
</div>`;
  // shot volume (Corsi = all attempts, Fenwick = unblocked), toggle like xG
  {const hasFF=gs.length&&gs.every(g=>Array.isArray(g.ff)); if(!hasFF&&SM!=="cf")SM="cf";
   const src=g=>SM==="ff"?g.ff:g.att, vT=sum(gs.map(g=>src(g)[0])), vO=sum(gs.map(g=>src(g)[1])), vp=pct(vT,vO), nm=SM==="ff"?"FENWICK":"CORSI";
   const sseg=hasFF?`<div class="xmrow"><div class="seg sm" id="sm">${[["cf","CORSI"],["ff","FENWICK"]].map(([k,l])=>`<button data-s2="${k}" class="${SM===k?"on":""}">${l}</button>`).join("")}</div></div>`:"";
   h+=`<div class="card"><div class="h">SHOT VOLUME${PB}</div>${sseg}
    <div class="sb"><div class="l" style="width:${vp}%">${vp}%</div><div class="r" style="width:${100-vp}%">${100-vp}%</div></div>
    <div class="sbl"><span>TRENTON</span><span>OPPONENTS</span></div>
    <div class="tiles" style="grid-template-columns:minmax(0,1fr)">${tile(nm+" / GAME",vT/n,vO/n,f1)}</div></div>`;}
  // per-game zone counts by strength (EV = total − PP − PK)
  const zOf=(g,str,E)=>{const T=E?[g.entries.c,g.entries.d,g.entries.f]:[g.exits.c,g.exits.d,g.exits.i,g.exits.f];
    if(str==="all")return T; const z=g.pzs||(g.st&&g.st.zs); if(!z)return T.map(()=>0);
    const pick=o=>{const q=E?o.e:o.x;return E?[q.c,q.d,q.f]:[q.c,q.d,q.i,q.f];};
    if(str==="pp")return pick(z.pp); if(str==="pk")return pick(z.pk);
    const p=pick(z.pp),k=pick(z.pk);return T.map((v,i)=>v-p[i]-k[i]);};
  if(snF){const S=k=>sum(sgF.map(g=>g.st[k]||0));
    const pp=S("pp"),ppg=S("ppg"),kpk=S("oppPp"),kg=S("oppPpg");
    const xpp=pp?S("ppXg")/pp:0, xpk=kpk?S("oppPpXg")/kpk:0, p2=100*xpp/((xpp+xpk)||1);
    const zsg=sgF.filter(g=>g.st.zs), add=(arr)=>arr.reduce((t,a)=>t.map((v,i)=>v+a[i]),arr[0].map(()=>0));
    const zt=(lab,parts)=>{const t=sum(parts.map(p=>p[0])), ok=parts[0][0]+parts[1][0];
      return `<div class="pt stz"><div class="ptt">${lab}</div><div class="stzv">${t?Math.round(100*ok/t)+"%":"–"}</div><div class="ptb">${parts.map(p=>`<i style="width:${t?100*p[0]/t:0}%;background:${p[1]}"></i>`).join("")}</div><div class="stzn">${parts.map(p=>`<span><b style="color:${p[3]}">${p[0]}</b> ${p[2]}</span>`).join("")}</div></div>`;};
    let ztiles="";
    if(zsg.length){const e=add(zsg.map(g=>zOf(g,"pp",true))), x=add(zsg.map(g=>zOf(g,"pk",false)));
      ztiles=`<div class="tiles" style="grid-template-columns:1fr 1fr">${zt("PP ENTRY SUCCESS",[[e[0],C.t,"Ctrl",C.t],[e[1],C.dump,"Dump",C.dumpT],[e[2],C.fail,"Failed",C.fail]])}${zt("PK EXIT SUCCESS",[[x[0],C.t,"Ctrl",C.t],[x[1]+x[2],C.dump,"Dump",C.dumpT],[x[3],C.fail,"Failed",C.fail]])}</div>`;}
    h+=`<div class="card"><div class="h">SPECIAL TEAMS${FG}</div>
      <div class="sbh">xG PER POWER PLAY</div>
      <div class="sb"><div class="l" style="width:${p2}%">${pp?f2(xpp):"–"}</div><div class="r" style="width:${100-p2}%">${kpk?f2(xpk):"–"}</div></div>
      <div class="sbl"><span>TRENTON PP · ${ppg}/${pp}</span><span>OPPONENT PP · ${kg}/${kpk}</span></div>
      <div class="tiles" style="grid-template-columns:1fr 1fr">${tile("ATT / POWER PLAY",pp?S("ppAtt")/pp:0,kpk?S("oppPpAtt")/kpk:0,f1)}${tile("SH xG / GAME",S("shXg")/snF,S("oppShXg")/snF,f2)}</div>
      ${ztiles}</div>`;}
  // game by game
  const rows=gs.slice().reverse().map(g=>{const r=resOf(g);
    const [a,b,fmt]=GM==="xg"?[g.xg[0],g.xg[1],f2]:GM==="st"?(g.st?[...stX(g),f2]:[0,0,v=>"–"]):[pct(g.att[0],g.att[1]),100-pct(g.att[0],g.att[1]),v=>v+"%"];
    const w=100*a/((a+b)||1), tag=g.card?"a":"div";
    return `<${tag} class="g"${g.card?` href="${g.card}"`:""}><div class="gh"><span class="res ${r}">${r}${g.score?` ${g.score[0]}–${g.score[1]}${g.ot?" OT":""}`:""}</span><span class="gn">${hasHA?(g.home?"vs ":"@ "):""}${g.opp}</span><span class="gd">${dfmt(g.date)}</span>${g.card?`<span class="arr">›</span>`:""}</div>
      <div class="gb"><div class="l" style="width:${w}%">${fmt(a)}</div><div class="r" style="width:${100-w}%">${fmt(b)}</div></div>${GM==="sv"?`<div class="ga"><span>${g.att[0]} ATT</span><span>${g.att[1]} ATT</span></div>`:""}${GM==="st"&&g.st?`<div class="gs"><span>${g.st.ppg}/${g.st.pp} PP</span><span>${g.st.oppPpg}/${g.st.oppPp} PP</span></div>`:""}</${tag}>`;}).join("");
  if(gs.length>1)h+=`<div class="card"><div class="hrow"><div class="h">GAME BY GAME${PB?`<span class="pill">${PL[P]}</span>`:""}</div><div class="seg sm" id="gm"><button data-m="xg" class="${GM==="xg"?"on":""}">xG</button><button data-m="sv" class="${GM==="sv"?"on":""}">SHOT VOL</button>${sn?`<button data-m="st" class="${GM==="st"?"on":""}">ST</button>`:""}</div></div><div class="gl">${rows}</div></div>`;
  // zones (with strength drilldown once games carry st.zs)
  const E=ZM==="entries", zsOf=g=>g.pzs||(g.st&&g.st.zs), hasZs=gs.some(zsOf);
  if(!hasZs&&ZS!=="all")ZS="all";
  const zg=ZS==="all"?gs:gs.filter(zsOf);
  const cols=E?[C.t,C.dump,C.fail]:[C.t,C.dump,C.ice,C.fail], txt=E?[C.t,C.dumpT,C.fail]:[C.t,C.dumpT,C.iceT,C.fail];
  const names=E?["Controlled","Dump-in","Failed"]:["Controlled","Dump-out","Icing","Failed"];
  const tot=names.map((_,i)=>sum(zg.map(g=>zOf(g,ZS,E)[i])));
  const items=names.map((nm,i)=>[nm,tot[i],cols[i],txt[i]]);
  if(!E&&ZS==="pk"){items.splice(2,1);tot[1]+=tot[2];tot.splice(2,1);items[1][1]=tot[1];}
  const T=sum(tot), ok=tot[0]+tot[1];
  const zr=zg.slice().reverse().map(g=>{const z=zOf(g,ZS,E),t=sum(z)||1;
    return `<div class="zgr"><span class="gn">${g.opp} <span class="gd">${dfmt(g.date)}</span></span><span class="pc">${sum(z)?Math.round(100*z[0]/t)+"%":"–"}</span><div class="zb">${z.map((v,i)=>`<i style="width:${100*v/t}%;background:${cols[i]}"></i>`).join("")}</div></div>`;}).join("");
  const zseg=hasZs?`<div class="xmrow"><div class="seg sm" id="zsx">${[["all","ALL"],["ev","EVEN STRENGTH"],["pp","POWER PLAY"],["pk","PENALTY KILL"]].map(([k,l])=>`<button data-s="${k}" class="${ZS===k?"on":""}">${l}</button>`).join("")}</div></div>`:"";
  h+=`<div class="card"><div class="hrow"><div class="h">${E?"ZONE ENTRIES":"ZONE EXITS"}${PB?`<span class="pill">${PL[P]}</span>`:""}</div><div class="seg sm" id="zm"><button data-z="entries" class="${E?"on":""}">ENTRIES</button><button data-z="exits" class="${E?"":"on"}">EXITS</button></div></div>${zseg}
    <div class="zsum"><span>${E?"Successful entries":"Successful exits"}</span><b>${T?Math.round(100*ok/T)+"%":"–"}</b><em>${ok} / ${T}</em></div>
    <div class="zwrap"><div>${T?ring(items,""):""}</div><div class="zl">${items.map(i=>`<div><b style="color:${i[3]}">${i[1]}</b><span>${i[0]}</span></div>`).join("")}</div></div>
    ${zg.length>1?`<div class="zg">${zr}</div>`:""}</div>`;
  // players (skaters / lines / goalies)
  const pg=G0.filter(g=>g.sk||g.ln||g.gk);
  if(pg.length){
    const seg=`<div class="xmrow"><div class="seg sm" id="pm">${[["sk","SKATERS"],["ln","LINES"],["gk","GOALIES"]].map(([k,l])=>`<button data-p="${k}" class="${PM===k?"on":""}">${l}</button>`).join("")}</div></div>`;
    let body="";
    if(PM==="sk"){const agg={};pg.forEach(g=>Object.entries(g.sk||{}).forEach(([n,[x,a]])=>{agg[n]=agg[n]||[0,0,0];agg[n][0]+=x;agg[n][1]+=a;agg[n][2]++;}));
      let list=Object.entries(agg).map(([n,v])=>({n,nm:(ROSTER[n]||["#"+n,""])[0],pos:(ROSTER[n]||["",""])[1],x:v[0],a:v[1]}));
      if(PF!=="all")list=list.filter(p=>p.pos===PF);
      list.sort((p,q)=>q.x-p.x||q.a-p.a);const mx=Math.max(...list.map(p=>p.x),0.01), tx=sum(pg.map(g=>g.xg[0]))||1;
      const sub=`<div class="xmrow"><div class="seg sm" id="pf">${[["all","ALL"],["F","FORWARDS"],["D","DEFENSE"]].map(([k,l])=>`<button data-pf="${k}" class="${PF===k?"on":""}">${l}</button>`).join("")}</div></div>`;
      body=sub+`<div class="ph"><span>PLAYER</span><span>ixG · ATT · SHARE</span></div><div class="pl">${list.map(p=>`<div class="pr"><span class="nm"><em>#${p.n}</em>${p.nm}</span><span class="vals"><b>${f2(p.x)}</b> · ${p.a} · ${Math.round(100*p.x/tx)}%</span><div class="pb"><i style="width:${100*p.x/mx}%"></i></div></div>`).join("")}</div>`;}
    if(PM==="ln"){const agg={};pg.forEach(g=>(g.ln||[]).forEach(([u,pl,x,c])=>{const k=pl;agg[k]=agg[k]||{u,pl,x:0,c:0,n:0};agg[k].x+=x;agg[k].c+=c;agg[k].n++;agg[k].u=u;}));
      const list=Object.values(agg).sort((a,b)=>(a.u[0]===b.u[0]?0:a.u[0]==="F"?-1:1)||b.x-a.x);const mx=Math.max(...list.map(l=>l.x),0.01);
      body=`<div class="ph"><span>UNIT</span><span>xG · ATT · GP</span></div><div class="pl">${list.map(l=>`<div class="pr"><span class="nm"><em>${l.u}</em>${l.pl}</span><span class="vals"><b>${f2(l.x)}</b> · ${l.c} · ${l.n}</span><div class="pb"><i style="width:${100*l.x/mx}%"></i></div></div>`).join("")}</div>`;}
    if(PM==="gk"){const agg={};pg.forEach(g=>(g.gk||[]).forEach(([nm,sa,sv,ga,xga])=>{agg[nm]=agg[nm]||{nm,gp:0,sa:0,sv:0,ga:0,xga:0};const a=agg[nm];a.gp++;a.sa+=sa;a.sv+=sv;a.ga+=ga;a.xga+=xga;}));
      const list=Object.values(agg).sort((a,b)=>b.gp-a.gp);
      body=`<table class="gt"><tr><th>GOALIE</th><th>GP</th><th>SA</th><th>SV%</th><th>GA</th><th>xGA</th><th>GSAx</th></tr>${list.map(a=>{const gsax=a.xga-a.ga;return `<tr><td>${a.nm}</td><td>${a.gp}</td><td>${a.sa}</td><td>${a.sa?(a.sv/a.sa).toFixed(3).replace(/^0/,""):"–"}</td><td>${a.ga}</td><td>${f2(a.xga)}</td><td style="color:${gsax>=0?"#1d7a3a":"#c62828"}">${gsax>=0?"+":""}${f2(gsax)}</td></tr>`;}).join("")}</table>`;}
    h+=`<div class="card"><div class="h">PLAYERS${FG}</div>${seg}${body}</div>`;}
  document.getElementById("app").innerHTML=h;
  wire();
}
render();
})();
</script>
</body></html>
